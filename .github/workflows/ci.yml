name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: Сборка и проверки (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      - name: Проверка типов фронтенда
        run: npm run check

      - name: Сборка фронтенда
        run: npm run build

      - name: Форматирование Rust
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy (предупреждения = ошибки)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты
        working-directory: src-tauri
        run: cargo test

  windows:
    name: Сборка и проверки (Windows)
    runs-on: windows-latest
    env:
      # bindgen (whisper-rs-sys, llama-cpp-sys-2) требует libclang.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Ninja вместо MSBuild: у MSBuild гонка на первом билде генератора
      # Vulkan-шейдеров ggml (вложенный ExternalProject) — падает свежая
      # сборка; Ninja собирает с первого раза и без tlog-длинных путей.
      CMAKE_GENERATOR: Ninja
      # Короткий target: cl.exe не умеет писать в пути >260 символов
      # (C1083 «Cannot open compiler generated file»), а try-compile
      # сборщика Vulkan-шейдеров вкладывается очень глубоко.
      CARGO_TARGET_DIR: C:\t
      # Не даём ggml whisper'а печь бинарь под CPU раннера (GGML_NATIVE):
      # фиксируем базовый уровень AVX2+FMA — тот же, что x86-64-v3 в
      # .cargo/config.toml. whisper-rs-sys пробрасывает GGML_* в CMake.
      GGML_NATIVE: OFF
      GGML_AVX2: ON
      GGML_FMA: ON
      GGML_F16C: ON
      GGML_BMI2: ON
    steps:
      - uses: actions/checkout@v4

      # ggml-vulkan (whisper-rs/llama-cpp-2 с фичей vulkan) требует при
      # сборке заголовки, vulkan-1.lib и компилятор шейдеров из SDK.
      - name: Vulkan SDK
        run: |
          curl -Lo vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/1.4.350.0/windows/vulkan_sdk.exe
          Start-Process .\vulkan_sdk.exe -ArgumentList "--root","C:\VulkanSDK\1.4.350.0","--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\1.4.350.0" >> $env:GITHUB_ENV

      # Генератор Vulkan-шейдеров — вложенный ExternalProject, его пути
      # перелезают MAX_PATH (MSB3491) — включаем длинные пути.
      - name: Длинные пути NTFS
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -Type DWord

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      - name: Проверка типов фронтенда
        run: npm run check

      - name: Сборка фронтенда
        run: npm run build

      - name: Форматирование Rust
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy (предупреждения = ошибки)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Тесты
        working-directory: src-tauri
        run: cargo test
