name: Release

# Релиз по тегу v*: сборка .dmg (macOS, Apple Silicon) и NSIS-инсталлера
# (Windows x64), публикация артефактов в GitHub Releases.
# Формат артефактов совместим с tauri-plugin-updater (задел на будущее).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    env:
      # Подпись артефактов автообновления (tauri-plugin-updater).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      - name: Сборка приложения (.app + .dmg)
        run: npx tauri build

      - name: Публикация в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          generate_release_notes: true

  windows:
    name: Windows (x64, NSIS)
    runs-on: windows-latest
    env:
      # bindgen (whisper-rs-sys, llama-cpp-sys-2) требует libclang.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # Ninja вместо MSBuild: у MSBuild гонка на первом билде генератора
      # Vulkan-шейдеров ggml — падает свежая сборка (подробнее в ci.yml).
      CMAKE_GENERATOR: Ninja
      # Короткий target: cl.exe не умеет пути >260 символов (см. ci.yml).
      CARGO_TARGET_DIR: C:\t
      # Подпись артефактов автообновления (tauri-plugin-updater).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Релизный бинарь обязан быть воспроизводимым по набору инструкций:
      # базовый уровень AVX2+FMA (как x86-64-v3 в .cargo/config.toml),
      # а не возможности CPU конкретного раннера (GGML_NATIVE).
      GGML_NATIVE: OFF
      GGML_AVX2: ON
      GGML_FMA: ON
      GGML_F16C: ON
      GGML_BMI2: ON
    steps:
      - uses: actions/checkout@v4

      # ggml-vulkan (whisper-rs/llama-cpp-2 с фичей vulkan) требует при
      # сборке заголовки, vulkan-1.lib и компилятор шейдеров из SDK.
      - name: Vulkan SDK
        run: |
          curl -Lo vulkan_sdk.exe https://sdk.lunarg.com/sdk/download/1.4.350.0/windows/vulkan_sdk.exe
          Start-Process .\vulkan_sdk.exe -ArgumentList "--root","C:\VulkanSDK\1.4.350.0","--accept-licenses","--default-answer","--confirm-command","install" -Wait
          "VULKAN_SDK=C:\VulkanSDK\1.4.350.0" >> $env:GITHUB_ENV

      # Генератор Vulkan-шейдеров — вложенный ExternalProject, его пути
      # перелезают MAX_PATH (MSB3491) — включаем длинные пути.
      - name: Длинные пути NTFS
        run: Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -Value 1 -Type DWord

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Зависимости фронтенда
        run: npm ci

      - name: Сборка приложения (NSIS-инсталлер)
        run: npx tauri build

      - name: Публикация в GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            C:\t\release\bundle\nsis\*.exe
            C:\t\release\bundle\nsis\*.exe.sig
          generate_release_notes: true

  # Манифест автообновления: приложения опрашивают
  # releases/latest/download/latest.json (см. plugins.updater в tauri.conf).
  updater-manifest:
    name: Манифест автообновления (latest.json)
    needs: [macos, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Сборка и загрузка latest.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"

          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir sigs
          ls -la sigs

          MAC_TGZ=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep '\.app\.tar\.gz$')
          WIN_EXE=$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -- '-setup\.exe$')

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg mac_sig "$(cat "sigs/${MAC_TGZ}.sig")" \
            --arg mac_url "${BASE}/${MAC_TGZ}" \
            --arg win_sig "$(cat "sigs/${WIN_EXE}.sig")" \
            --arg win_url "${BASE}/${WIN_EXE}" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_sig, url: $mac_url },
                "windows-x86_64": { signature: $win_sig, url: $win_url }
              }
            }' > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
