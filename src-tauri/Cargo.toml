[package]
name = "voice-input"
version = "0.2.1"
description = "Голосовой ввод текста: локальное распознавание (whisper.cpp) и вычитка"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.18"
rubato = "4"
hound = "3.5"
voice_activity_detector = "0.2.1"
arboard = "3.6"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
ureq = "3.3"
regex = "1"
encoding_rs = "0.8"

# whisper-rs и llama-cpp-2 объявлены per-target: фича metal существует только
# на macOS (whisper-rs-sys с ней безусловно включает GGML_METAL и ломает
# сборку на Windows).
#
# ВАЖНО: dynamic-link у llama-cpp-2 обязателен НА ОБЕИХ платформах. whisper-rs
# и llama-cpp-2 несут РАЗНЫЕ копии ggml; при статической линковке обеих
# C-символы ggml_* конфликтуют, линкер оставляет одну копию, и whisper получает
# чужой бэкенд с несовместимым ABI → NaN-логиты и пустое распознавание.
# macOS: dylib + two-level namespace изолируют символы llama. Windows: llama
# уходит в DLL со своим пространством имён, статический ggml whisper-rs в exe
# с ним не пересекается. Подробности: PROGRESS.md, риск R-13 в SPEC.md.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
llama-cpp-2 = { version = "0.1.151", features = ["metal", "dynamic-link"] }
objc2 = "0.6"
block2 = "0.6"
coreaudio-sys = "0.2"
core-foundation = "0.10"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSWindow",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSSound",
] }
core-graphics = "0.25"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(target_os = "windows")'.dependencies]
# vulkan — кросс-вендорное GPU-ускорение (NVIDIA/AMD/Intel): на CPU
# large-v3-turbo распознаёт фразу ~2 минуты, на GPU — секунды. Для сборки
# нужен Vulkan SDK (VULKAN_SDK), в рантайме — vulkan-1.dll из видеодрайвера
# (линкуется delay-load, см. build.rs: без драйвера приложение стартует,
# а Whisper переводится на CPU рычагом VOICE_INPUT_NO_GPU=1).
whisper-rs = { version = "0.16", features = ["vulkan"] }
llama-cpp-2 = { version = "0.1.151", features = ["dynamic-link", "vulkan"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
] }

[profile.release]
lto = "thin"
codegen-units = 4

[lints.clippy]
# unimplemented!() в platform/windows/ — осознанные заглушки этапа 2
todo = "deny"
