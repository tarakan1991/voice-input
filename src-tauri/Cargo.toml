[package]
name = "voice-input"
version = "0.1.0"
description = "Голосовой ввод текста: локальное распознавание (whisper.cpp) и вычитка"
edition = "2021"
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
cpal = "0.18"
rubato = "4"
hound = "3.5"
voice_activity_detector = "0.2.1"
whisper-rs = { version = "0.16", features = ["metal"] }
# ВАЖНО: dynamic-link обязателен. whisper-rs и llama-cpp-2 несут РАЗНЫЕ копии
# ggml; при статической линковке обеих C-символы ggml_* конфликтуют, линкер
# оставляет одну копию, и whisper получает чужой Metal-бэкенд с несовместимым
# ABI → NaN-логиты и пустое распознавание. Dylib изолирует символы llama
# (two-level namespace macOS). Подробности: PROGRESS.md.
llama-cpp-2 = { version = "0.1.151", features = ["metal", "dynamic-link"] }
arboard = "3.6"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sha2 = "0.10"
ureq = "3.3"
regex = "1"
encoding_rs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
coreaudio-sys = "0.2"
core-foundation = "0.10"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSWorkspace",
    "NSRunningApplication",
    "NSApplication",
    "NSWindow",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSSound",
] }
core-graphics = "0.25"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[profile.release]
lto = "thin"
codegen-units = 4

[lints.clippy]
# unimplemented!() в platform/windows/ — осознанные заглушки этапа 2
todo = "deny"
